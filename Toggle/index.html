<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Toggle Demo</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 100px;
      background-color: #f0f0f0;
      transition: 0.3s;
    }

    h1 {
      margin-bottom: 20px;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #2d6cdf;
      color: white;
    }

    .dark {
      background-color: #222;
      color: white;
    }
  </style>
</head>

<body>

  <h1 id="status">Light Mode</h1>
  <button onclick="toggleMode()">Toggle Mode</button>

  <script>
    function toggleMode() {
      document.body.classList.toggle("dark");

      let text = document.getElementById("status");

      if (document.body.classList.contains("dark")) {
        text.innerText = "Dark Mode 🌙";
      } else {
        text.innerText = "Light Mode ☀️";
      }
    }
  </script>

</body>
</html>
